apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: booking-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: booking-service
spec:
  hosts: ["*"]
  gateways: ["booking-gateway"]
  http:
    # Маршрут фича-флага: заголовок x-feature-route ставит EnvoyFilter
    - match:
        - headers:
            x-feature-route:
              exact: v2
      route:
        - destination:
            host: booking-service
            subset: v2
    # Канареечный маршрут с повторами при ошибках
    - route:
        - destination:
            host: booking-service
            subset: v1
          weight: 90
        - destination:
            host: booking-service
            subset: v2
          weight: 10
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream
