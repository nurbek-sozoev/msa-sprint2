version: v2
replicaCount: 1

image:
  name: booking-service
  tag: latest
  pullPolicy: Never

service:
  enabled: false
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

livenessProbe:
  path: /ping
  initialDelaySeconds: 3
  periodSeconds: 10

readinessProbe:
  path: /ping
  initialDelaySeconds: 3
  periodSeconds: 5

env:
  - name: VERSION
    value: v2

featureX: true
